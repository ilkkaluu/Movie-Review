<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Movie Review{% endblock %}</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1ea;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #b45309;
        --accent-strong: #92400e;
        --border: #e5e7eb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #f8f3eb 0%, var(--bg) 100%);
        color: var(--text);
      }

      .shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(100%, 420px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px;
        box-shadow: 0 20px 60px rgba(31, 41, 55, 0.08);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }

      .brand {
        font-size: 1.1rem;
        font-weight: 700;
        text-decoration: none;
        color: var(--text);
      }

      .nav {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .nav a, .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid var(--border);
        text-decoration: none;
        color: var(--text);
        background: #fff;
      }

      .nav form {
        margin: 0;
      }

      .button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .nav a:hover, .button:hover { border-color: var(--accent); }
      .button.primary:hover { background: var(--accent-strong); }

      .field {
        margin-bottom: 16px;
      }

      .field label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.95rem;
        color: var(--muted);
      }

      .field input {
        width: 100%;
        min-height: 44px;
        border-radius: 12px;
        border: 1px solid var(--border);
        padding: 10px 12px;
        font: inherit;
      }

      .field select,
      .field textarea {
        width: 100%;
        border-radius: 12px;
        border: 1px solid var(--border);
        padding: 10px 12px;
        font: inherit;
      }

      .field input[type="checkbox"] {
        width: auto;
        min-height: auto;
        padding: 0;
      }

      .field input:focus {
        outline: 2px solid rgba(180, 83, 9, 0.2);
        border-color: var(--accent);
      }

      .field select:focus,
      .field textarea:focus {
        outline: 2px solid rgba(180, 83, 9, 0.2);
        border-color: var(--accent);
      }

      .help {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .errorlist {
        margin: 0 0 16px;
        padding-left: 20px;
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="topbar">
          <a class="brand" href="{% url 'home' %}">Movie Review</a>
          {% if request.resolver_match.url_name != 'login' %}
            <nav class="nav">
              {% if user.is_authenticated %}
                <span class="help">Logged in as {{ user.username }}</span>
                <form action="{% url 'logout' %}" method="post">
                  {% csrf_token %}
                  <button class="button" type="submit">Log out</button>
                </form>
              {% else %}
                <a href="{% url 'login' %}">Log in</a>
                <a class="button primary" href="{% url 'register' %}">Register</a>
              {% endif %}
            </nav>
          {% endif %}
        </div>

        {% block content %}{% endblock %}
      </div>
    </div>
  </body>
</html>
