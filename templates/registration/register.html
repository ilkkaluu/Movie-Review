{% extends "base.html" %}

{% block title %}Register | Movie Review{% endblock %}

{% block content %}
  <h1>Register</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <div class="field">
        {{ field.label_tag }}
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}
    <button class="button primary" type="submit">Create account</button>
  </form>
  <p class="help">Already registered? <a href="{% url 'login' %}">Log in here</a>.</p>
{% endblock %}
